<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var t;try{t=localStorage.getItem('home-theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rui D. G. Matias: AI-driven quantum twins for chemical separation processes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Doctoral work on simulation and control of pressure swing adsorption for biogas upgrading: articles, code and interactive interfaces.">
<style>
@font-face{font-family:Sora;src:url(assets/fonts/sora-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}
/* Black page, white text (21:1). Colour lives only in the figures:
   #0099FF and #00D3FB for clean gas and methane, #E0F354 for CO2 (13.5:1 on the figure background). */
:root{--bg:#000;--ink:#fff;--sky:#0099ff;--cyan:#00d3fb;--lime:#e0f354;--panel:rgba(22,24,28,.72);--line:rgba(255,255,255,.12);--g:clamp(20px,4vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink)}
body{font-family:Sora,system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top,.hero,.works,footer{max-width:1680px;margin-inline:auto}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px var(--g)}
.top b{font-weight:600;letter-spacing:-.01em}
.top nav{display:flex;gap:26px;font-size:15px}
.top nav a{text-decoration:none}
.top nav a:hover{text-decoration:underline;text-underline-offset:.25em}

/* Hero: text on the left, the glass columns behind on the right */
.hero{position:relative;min-height:min(86svh,820px);display:flex;align-items:center;padding:0 var(--g) 80px;overflow:hidden}
#hero-flow{position:absolute;top:0;left:46%;width:54%;height:100%;display:block}
#hero-flow.no-gl{display:none}
.hero .fade{position:absolute;inset:0;background:linear-gradient(90deg,#000 22%,rgba(0,0,0,.65) 44%,rgba(0,0,0,0) 64%);pointer-events:none}
.hero-text{position:relative;z-index:1;max-width:min(680px,46%)}
.hero h1{font-weight:400;font-size:clamp(28px,2.7vw,44px);line-height:1.12;line-height:1.02;letter-spacing:-.035em}
.hero p{margin-top:24px;font-size:19px;line-height:1.5;max-width:40ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.pill{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;font:inherit;font-size:16px;font-weight:500;text-decoration:none;border:1px solid var(--ink);cursor:pointer;transition:background .15s,color .15s}
.pill.solid{background:var(--ink);color:#000}
.pill.solid:hover{background:transparent;color:var(--ink)}
.pill.line{background:transparent;color:var(--ink)}
.pill.line:hover{background:var(--ink);color:#000}
.hero-cap{position:absolute;left:var(--g);bottom:28px;z-index:1;display:flex;align-items:center;gap:16px;font-size:14px;max-width:480px}
.pill.small{min-height:40px;padding:0 18px;font-size:14px}

/* The works, in one glass window */
.works{padding:0 var(--g) 96px}
.window{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(28,31,36,.9),rgba(14,15,18,.95));box-shadow:0 40px 120px rgba(0,120,255,.08)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 26px;border-bottom:1px solid var(--line);font-size:15px}
.bar h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.win-body{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:18px;padding:18px}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:14px}
.list{list-style:none;display:flex;flex-direction:column;gap:4px}
.list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.8em 1fr;gap:4px;width:100%;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:15px;line-height:1.3}
.list button:hover{background:rgba(255,255,255,.06)}
.list button:focus-visible{outline:2px solid var(--ink)}
.list li.active button{background:rgba(255,255,255,.12)}
.list .n{font-weight:600;font-variant-numeric:tabular-nums}
.list small{grid-column:2;font-size:13px;font-style:italic}
.screen{border:1px solid var(--line);border-radius:18px;background:#000;overflow:hidden;display:flex;flex-direction:column;min-height:440px;
  --ink:#fff;--co2:#e0f354;--ch4:#00d3fb;--band:rgba(0,153,255,.12);--handle:#fff}
.screen canvas{flex:1 1 0;min-height:440px;width:100%;display:block}
.screen .cap{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 16px 14px;font-size:14px}
.detail h3{font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-.02em}
.detail p{margin-top:10px;font-size:15px}
.detail .actions{margin-top:20px;flex-direction:column;align-items:stretch}
.detail .pill{justify-content:center}
.detail .later{margin-top:14px;font-size:14px;font-style:italic}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;padding:28px var(--g) 40px;border-top:1px solid var(--line);font-size:14px}
footer div{display:flex;gap:24px}

@media (max-width:1100px){.win-body{grid-template-columns:230px minmax(0,1fr)}.detail{grid-column:1/-1}}
@media (max-width:760px){
  .hero-text{max-width:none}
  .screen canvas{min-height:300px}
  .hero{min-height:auto;padding-top:40px;padding-bottom:420px;align-items:flex-start}
  #hero-flow{top:auto;bottom:80px;left:0;right:0;width:100%;height:340px}
  .hero .fade{background:linear-gradient(180deg,#000 45%,rgba(0,0,0,0) 75%)}
  .hero-cap{left:var(--g);right:var(--g);bottom:16px;text-align:left;justify-content:space-between}
  .win-body{grid-template-columns:1fr;padding:12px}
  .screen{min-height:340px}
  .top nav a{display:none}
}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}
  .h1more { display: block; margin-top: .35em; }
.top nav button{all:unset;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}
.top nav button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* light: graphite on a pale grey page, white panels */
:root[data-theme=light]{--bg:#eceef1;--ink:#111;--panel:#ffffff;--line:rgba(0,0,0,.12)}
:root[data-theme=light] .hero .fade{background:linear-gradient(90deg,#eceef1 22%,rgba(236,238,241,.65) 44%,rgba(236,238,241,0) 64%)}
:root[data-theme=light] .window{background:linear-gradient(180deg,#f7f8f9,#f1f2f4);box-shadow:0 30px 90px rgba(0,0,0,.08)}
:root[data-theme=light] .screen{background:#fff;--ink:#111}
:root[data-theme=light] .pill.solid{color:#fff}
:root[data-theme=light] .pill.solid:hover{color:var(--ink)}
:root[data-theme=light] .pill.line:hover{color:#fff}
:root[data-theme=light] .list button:hover{background:rgba(0,0,0,.05)}
:root[data-theme=light] .list li.active button{background:rgba(0,0,0,.08)}
@media (max-width:760px){:root[data-theme=light] .hero .fade{background:linear-gradient(180deg,#eceef1 45%,rgba(236,238,241,0) 75%)}}
</style>
</head>
<body data-select="click">
<header class="top">
  <b>Rui D. G. Matias</b>
  <nav aria-label="Contact"><a href="#works">Works</a><a href="mailto:up201806812@up.pt">Email</a><button id="theme" type="button">Light mode</button></nav>
</header>

<section class="hero">
  <canvas id="hero-flow" data-symbol="landscape" role="img" aria-label="A surface drawn as a mesh of lines, with several paths climbing towards its highest point, slowly turning."></canvas>
  <div class="hero-text">
    <h1>AI-Driven Quantum Twins for Chemical Separation Processes: Application to a Pressure Swing Adsorption Unit for Biogas&nbsp;Upgrading,<span class="h1more">and Other Work Along the Way</span></h1>
    <p>A preencher</p>
  </div>
</section>

<main class="works" id="works">
  <section class="window" aria-label="Works">
    <div class="win-body">
      <nav class="card" aria-label="Works"><ol class="list" id="work-list"></ol></nav>
      <figure class="screen"><canvas id="screen" role="img"></canvas></figure>
      <article class="card detail" id="detail" aria-live="polite"></article>
    </div>
  </section>
</main>

<footer><span>Rui D. G. Matias, LSRE-LCM, Faculty of Engineering, University of Porto</span><div><a href="mailto:up201806812@up.pt">up201806812@up.pt</a></div></footer>

<script>
(() => { const b = document.getElementById('theme'), set = t => { document.documentElement.dataset.theme = t; b.textContent = t === 'light' ? 'Dark mode' : 'Light mode'; try { localStorage.setItem('home-theme', t); } catch (e) {} };
  set(document.documentElement.dataset.theme); b.onclick = () => set(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); })();
</script>
<script src="assets/hero-symbol.js?v=20261112"></script>
<script src="assets/works.js?v=20261112"></script>

</body>
</html>
